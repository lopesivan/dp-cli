pattern: factory
description: Factory Method Java com produto e criador abstratos.
fields:
  - name: package
    default: com.example.app
    prompt: Pacote Java
    required: true
  - name: product_interface
    default: Product
    prompt: Interface do produto
    required: true
  - name: concrete_product
    default: ConcreteProduct
    prompt: Produto concreto
    required: true
  - name: creator_class
    default: Creator
    prompt: Classe criadora
    required: true
  - name: concrete_creator
    default: ConcreteCreator
    prompt: Criador concreto
    required: true
  - name: factory_method
    default: createProduct
    prompt: Método fábrica
    required: true
  - name: operation_method
    default: operation
    prompt: Operação do produto
    required: true
  - name: output_dir
    default: src/main/java/com/example/app
    prompt: Diretório de saída
    required: true
outputs:
  - template: Product.java.j2
    output_path: "{{ output_dir }}/{{ product_interface }}.java"
  - template: ConcreteProduct.java.j2
    output_path: "{{ output_dir }}/{{ concrete_product }}.java"
  - template: Creator.java.j2
    output_path: "{{ output_dir }}/{{ creator_class }}.java"
  - template: ConcreteCreator.java.j2
    output_path: "{{ output_dir }}/{{ concrete_creator }}.java"
