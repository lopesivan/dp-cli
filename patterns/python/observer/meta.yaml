pattern: observer
description: Observer Python com Subject notificando ConcreteObserver.
fields:
  - name: subject_class
    default: Subject
    prompt: Nome da classe Subject
    required: true
  - name: observer_class
    default: Observer
    prompt: Nome da interface Observer
    required: true
  - name: concrete_observer_class
    default: ConcreteObserver
    prompt: Nome do ConcreteObserver
    required: true
  - name: update_method
    default: update
    prompt: Nome do método de notificação
    required: true
  - name: output_dir
    default: src
    prompt: Diretório de saída
    required: true
outputs:
  - template: observer.py.j2
    output_path: "{{ output_dir }}/observer.py"
