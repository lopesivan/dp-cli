pattern: factory
description: Factory Method Python com Creator delegando a criação de Product para subclasses.
fields:
  - name: product_class
    default: Product
    prompt: Nome da interface Product
    required: true
  - name: concrete_product_class
    default: ConcreteProduct
    prompt: Nome do ConcreteProduct
    required: true
  - name: creator_class
    default: Creator
    prompt: Nome da classe Creator
    required: true
  - name: concrete_creator_class
    default: ConcreteCreator
    prompt: Nome do ConcreteCreator
    required: true
  - name: factory_method
    default: create_product
    prompt: Nome do factory method
    required: true
  - name: output_dir
    default: src
    prompt: Diretório de saída
    required: true
outputs:
  - template: factory.py.j2
    output_path: "{{ output_dir }}/factory.py"
