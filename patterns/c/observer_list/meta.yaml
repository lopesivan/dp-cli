pattern: observer_list
description: Observer Pattern em C usando lista encadeada para gerenciar múltiplos observers.
fields:
  - name: prefix
    default: app
    prompt: Prefixo para as funções
    required: true
  - name: subject_name
    default: Subject
    prompt: Nome do Subject (ex: TimeSubject)
    required: true
  - name: observer_name
    default: Observer
    prompt: Nome do Observer (ex: TimeObserver)
    required: true
  - name: notification_data_type
    default: SystemTime
    prompt: Tipo de dados enviados na notificação (ex: SystemTime)
    required: true
  - name: notification_param_name
    default: newTime
    prompt: Nome do parâmetro na função de notificação
    required: true
  - name: observer_method
    default: notification
    prompt: Nome do método de notificação no observer
    required: true
  - name: header_dir
    default: include
    prompt: Diretório do cabeçalho
    required: true
  - name: source_dir
    default: src
    prompt: Diretório do código-fonte
    required: true
outputs:
  - template: observer.h.j2
    output_path: "{{ header_dir }}/{{ prefix }}_{{ observer_name }}.h"
  - template: subject.h.j2
    output_path: "{{ header_dir }}/{{ prefix }}_{{ subject_name }}.h"
  - template: subject.c.j2
    output_path: "{{ source_dir }}/{{ prefix }}_{{ subject_name }}.c"
