---
pattern: observer_coupled
description: Observer Pattern em C com acoplamento direto (subject conhece o observer
  específico).
fields:
  - name: prefix
    default: app
    prompt: Prefixo para as funções
    required: true
  - name: subject_name
    default: Subject
    prompt: 'Nome do Subject (ex: TimeSource)'
    required: true
  - name: observer_name
    default: Observer
    prompt: 'Nome do Observer (ex: DigitalStopWatch)'
    required: true
  - name: notification_data_type
    default: SystemTime
    prompt: Tipo de dados enviados na notificação
    required: true
  - name: notification_param_name
    default: newTime
    prompt: Nome do parâmetro na função de notificação
    required: true
  - name: observer_create_func
    default: createWatch
    prompt: Nome da função que cria o observer
    required: true
  - name: observer_notify_func
    default: notifyChangedTime
    prompt: Nome da função de notificação
    required: true
  - name: header_dir
    default: include
    prompt: Diretório do cabeçalho
    required: true
  - name: source_dir
    default: src
    prompt: Diretório do código-fonte
    required: true
outputs:
  - template: subject.h.j2
    output_path: '{{ header_dir }}/{{ prefix }}_{{ subject_name }}.h'
  - template: subject.c.j2
    output_path: '{{ source_dir }}/{{ prefix }}_{{ subject_name }}.c'
