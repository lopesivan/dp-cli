pattern: builder
description: Builder Lua com Director orquestrando a construção do Product.
fields:
  - name: module_name
    default: builder
    prompt: Nome do módulo Lua
    required: true
  - name: product_class
    default: Product
    prompt: Nome da classe Product
    required: true
  - name: builder_class
    default: Builder
    prompt: Nome da interface Builder
    required: true
  - name: concrete_builder_class
    default: ConcreteBuilder
    prompt: Nome do ConcreteBuilder
    required: true
  - name: director_class
    default: Director
    prompt: Nome da classe Director
    required: true
  - name: output_dir
    default: src
    prompt: Diretório de saída
    required: true
outputs:
  - template: builder.lua.j2
    output_path: "{{ output_dir }}/{{ module_name }}.lua"
