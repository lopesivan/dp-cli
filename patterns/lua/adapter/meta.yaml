pattern: adapter
description: Adapter Lua convertendo a interface de um Adaptee para o Target esperado pelo cliente.
fields:
  - name: module_name
    default: adapter
    prompt: Nome do módulo Lua
    required: true
  - name: target_class
    default: Target
    prompt: Nome da interface Target esperada pelo cliente
    required: true
  - name: adaptee_class
    default: Adaptee
    prompt: Nome da classe Adaptee (interface incompatível existente)
    required: true
  - name: adapter_class
    default: Adapter
    prompt: Nome da classe Adapter
    required: true
  - name: request_method
    default: request
    prompt: Nome do método esperado no Target
    required: true
  - name: specific_request_method
    default: specificRequest
    prompt: Nome do método existente no Adaptee
    required: true
  - name: output_dir
    default: src
    prompt: Diretório de saída
    required: true
outputs:
  - template: adapter.lua.j2
    output_path: "{{ output_dir }}/{{ module_name }}.lua"
