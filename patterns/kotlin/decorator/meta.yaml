pattern: decorator
description: Decorator Kotlin adicionando comportamento a um Component sem alterar sua interface.
fields:
  - name: package
    default: com.example.app
    prompt: Pacote Kotlin
    required: true
  - name: component_class
    default: Component
    prompt: Nome da interface Component
    required: true
  - name: concrete_component_class
    default: ConcreteComponent
    prompt: Nome do ConcreteComponent
    required: true
  - name: decorator_class
    default: Decorator
    prompt: Nome da classe base Decorator
    required: true
  - name: concrete_decorator_class
    default: ConcreteDecorator
    prompt: Nome do ConcreteDecorator
    required: true
  - name: operation_method
    default: operation
    prompt: Nome do método decorado
    required: true
  - name: output_dir
    default: src/main/kotlin
    prompt: Diretório de saída
    required: true
outputs:
  - template: Component.kt.j2
    output_path: "{{ output_dir }}/{{ package | replace('.', '/') }}/{{ component_class }}.kt"
  - template: ConcreteComponent.kt.j2
    output_path: "{{ output_dir }}/{{ package | replace('.', '/') }}/{{ concrete_component_class }}.kt"
  - template: Decorator.kt.j2
    output_path: "{{ output_dir }}/{{ package | replace('.', '/') }}/{{ decorator_class }}.kt"
  - template: ConcreteDecorator.kt.j2
    output_path: "{{ output_dir }}/{{ package | replace('.', '/') }}/{{ concrete_decorator_class }}.kt"
