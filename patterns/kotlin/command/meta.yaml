pattern: command
description: Command Kotlin com Invoker, Receiver e ConcreteCommand.
fields:
  - name: package
    default: com.example.app
    prompt: Pacote Kotlin
    required: true
  - name: command_class
    default: Command
    prompt: Nome da interface Command
    required: true
  - name: concrete_command_class
    default: ConcreteCommand
    prompt: Nome do ConcreteCommand
    required: true
  - name: receiver_class
    default: Receiver
    prompt: Nome da classe Receiver
    required: true
  - name: invoker_class
    default: Invoker
    prompt: Nome da classe Invoker
    required: true
  - name: action_method
    default: action
    prompt: Nome do método executado no Receiver
    required: true
  - name: output_dir
    default: src/main/kotlin/com/example/app
    prompt: Diretório de saída
    required: true
outputs:
  - template: Command.kt.j2
    output_path: "{{ output_dir }}/{{ command_class }}.kt"
  - template: Receiver.kt.j2
    output_path: "{{ output_dir }}/{{ receiver_class }}.kt"
  - template: ConcreteCommand.kt.j2
    output_path: "{{ output_dir }}/{{ concrete_command_class }}.kt"
  - template: Invoker.kt.j2
    output_path: "{{ output_dir }}/{{ invoker_class }}.kt"
