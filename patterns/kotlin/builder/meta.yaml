pattern: builder
description: Builder Kotlin com Director orquestrando a construção do Product.
fields:
  - name: package
    default: com.example.app
    prompt: Pacote Kotlin
    required: true
  - name: product_class
    default: Product
    prompt: Nome da classe Product
    required: true
  - name: builder_class
    default: Builder
    prompt: Nome da interface Builder
    required: true
  - name: concrete_builder_class
    default: ConcreteBuilder
    prompt: Nome do ConcreteBuilder
    required: true
  - name: director_class
    default: Director
    prompt: Nome da classe Director
    required: true
  - name: output_dir
    default: src/main/kotlin
    prompt: Diretório de saída
    required: true
outputs:
  - template: Product.kt.j2
    output_path: "{{ output_dir }}/{{ package | replace('.', '/') }}/{{ product_class }}.kt"
  - template: Builder.kt.j2
    output_path: "{{ output_dir }}/{{ package | replace('.', '/') }}/{{ builder_class }}.kt"
  - template: ConcreteBuilder.kt.j2
    output_path: "{{ output_dir }}/{{ package | replace('.', '/') }}/{{ concrete_builder_class }}.kt"
  - template: Director.kt.j2
    output_path: "{{ output_dir }}/{{ package | replace('.', '/') }}/{{ director_class }}.kt"
