---
pattern: singleton
description: Singleton Kotlin baseado em object.
fields:
  - name: package
    default: com.example.app
    prompt: Pacote Kotlin
    required: true
  - name: class_name
    default: Singleton
    prompt: Nome do objeto
    required: true
  - name: instance_method
    default: getInstance
    prompt: Método de acesso
    required: true
  - name: output_dir
    default: src/main/kotlin/com/example/app
    prompt: Diretório de saída
    required: true
outputs:
  - template: Singleton.kt.j2
    output_path: '{{ output_dir }}/{{ class_name }}.kt'
